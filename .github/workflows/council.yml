name: Консилиум

# Раз в неделю: одна короткая страница для владельца. Собирается скриптом, без ИИ.
on:
  schedule:
    # четверг в 16:00 по Уфе (11:00 UTC), после работы команды
    - cron: "0 11 * * 4"
  workflow_dispatch:

jobs:
  council:
    name: Консилиум
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Отчёт за неделю
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node .github/qa/steps.js council-script
      - name: Страница консилиума
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node .github/qa/steps.js council-issue
