name: Консилиум

# Порядок: тестировщики → критики → решатели → консилиум (итоговое решение).
# Каждый участник пишет свой отчёт задачей в Issues, следующий этап читает отчёты предыдущих.

on:
  schedule:
    # понедельник и четверг в 12:00 по Уфе (07:00 UTC), после утреннего обновления данных
    - cron: "0 7 * * 1,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "Что запустить"
        type: choice
        default: all
        options:
          - all
          - chain
          - council
          - fan
          - coach
          - gm
          - agent
          - data

concurrency:
  group: council
  cancel-in-progress: false

env:
  TESTER_LABELS: "qa-fan qa-coach qa-gm qa-agent qa-data"
  CRITIC_LABELS: "qa-critic-product qa-critic-tech"
  SOLVER_LABELS: "qa-solver-product qa-solver-tech"
  MODEL: claude-sonnet-5-5

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      roles: ${{ steps.r.outputs.roles }}
      test: ${{ steps.r.outputs.test }}
      chain: ${{ steps.r.outputs.chain }}
      council: ${{ steps.r.outputs.council }}
      since: ${{ steps.r.outputs.since }}
    steps:
      - id: r
        run: |
          M="${{ github.event.inputs.mode || 'all' }}"
          ROLES='["fan","coach","gm","agent","data"]'; T=true; C=true; K=true
          SINCE=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          case "$M" in
            all) ;;
            chain) T=false; SINCE=$(date -u -d '4 days ago' +%Y-%m-%dT%H:%M:%SZ) ;;
            council) T=false; C=false; SINCE=$(date -u -d '4 days ago' +%Y-%m-%dT%H:%M:%SZ) ;;
            *) ROLES="[\"$M\"]"; C=false; K=false ;;
          esac
          { echo "roles=$ROLES"; echo "test=$T"; echo "chain=$C"; echo "council=$K"; echo "since=$SINCE"; } >> "$GITHUB_OUTPUT"

  test:
    name: Тестировщик
    needs: pick
    if: needs.pick.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        role: ${{ fromJson(needs.pick.outputs.roles) }}
    permissions: { contents: read, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Браузер для тестов
        run: |
          npm init -y >/dev/null && npm install playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Задание
        run: |
          { cat .github/testers/common.md; echo; cat .github/testers/${{ matrix.role }}.md; } > qa-prompt.md
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Прочитай файл qa-prompt.md в корне репозитория и выполни задание из него полностью. Итог запиши в report.md."
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 60
            --allowedTools "Bash,Read,Write,Glob,Grep,WebSearch,WebFetch"
      - name: Задача с отчётом
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create qa --color D93F0B --description "Консилиум" --force >/dev/null 2>&1 || true
          gh label create "qa-${{ matrix.role }}" --color FBCA04 --force >/dev/null 2>&1 || true
          T="$( [ -s report.md ] && head -n1 report.md | sed 's/^# *//' || echo "Тестировщик ${{ matrix.role }} не дописал отчёт" ) · $(date +%d.%m.%Y)"
          [ -s report.md ] || echo "Прогон: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > report.md
          gh issue create --title "$T" --body-file report.md --label qa --label "qa-${{ matrix.role }}"

  critics:
    name: Критик
    needs: [pick, test]
    if: always() && needs.pick.outputs.chain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        who: [product, tech]
    permissions: { contents: read, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Браузер для проверок
        run: |
          npm init -y >/dev/null && npm install playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Отчёты тестировщиков
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash .github/testers/collect.sh "${{ needs.pick.outputs.since }}" qa-input.md $TESTER_LABELS
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Прочитай .github/testers/critic-${{ matrix.who }}.md и выполни задание. Итог запиши в report.md."
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 40
            --allowedTools "Bash,Read,Write,Glob,Grep"
      - name: Задача с отчётом
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create "qa-critic-${{ matrix.who }}" --color B60205 --force >/dev/null 2>&1 || true
          [ -s report.md ] || echo "# Критик ${{ matrix.who }} не дописал отчёт" > report.md
          gh issue create --title "$(head -n1 report.md | sed 's/^# *//') · $(date +%d.%m.%Y)" --body-file report.md --label qa --label "qa-critic-${{ matrix.who }}"

  solvers:
    name: Решатель
    needs: [pick, critics]
    if: always() && needs.pick.outputs.chain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        who: [product, tech]
    permissions: { contents: read, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Отчёты тестировщиков и критиков
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          bash .github/testers/collect.sh "${{ needs.pick.outputs.since }}" qa-input.md $TESTER_LABELS
          bash .github/testers/collect.sh "${{ needs.pick.outputs.since }}" qa-critics.md $CRITIC_LABELS
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Прочитай .github/testers/solver-${{ matrix.who }}.md и выполни задание. Итог запиши в report.md."
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 30
            --allowedTools "Read,Write,Glob,Grep"
      - name: Задача с отчётом
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create "qa-solver-${{ matrix.who }}" --color 0E8A16 --force >/dev/null 2>&1 || true
          [ -s report.md ] || echo "# Решатель ${{ matrix.who }} не дописал отчёт" > report.md
          gh issue create --title "$(head -n1 report.md | sed 's/^# *//') · $(date +%d.%m.%Y)" --body-file report.md --label qa --label "qa-solver-${{ matrix.who }}"

  council:
    name: Консилиум
    needs: [pick, test, critics, solvers]
    if: always() && needs.pick.outputs.council == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Все отчёты
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          S="${{ needs.pick.outputs.since }}"
          bash .github/testers/collect.sh "$S" qa-input.md $TESTER_LABELS
          bash .github/testers/collect.sh "$S" qa-critics.md $CRITIC_LABELS
          bash .github/testers/collect.sh "$S" qa-solvers.md $SOLVER_LABELS
          gh api "repos/${GITHUB_REPOSITORY}/issues?labels=qa-summary&state=all&per_page=1" \
            --jq '.[] | "# Прошлое решение #\(.number): \(.title)\n\n\(.body)"' > qa-prev-summary.md || true
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Прочитай .github/testers/summary.md и выполни задание. Итог запиши в summary.md."
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 30
            --allowedTools "Read,Write,Glob,Grep"
      - name: Решение консилиума
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create qa-summary --color 5319E7 --description "Решение консилиума" --force >/dev/null 2>&1 || true
          if [ -s summary.md ]; then
            gh issue create --title "Решение консилиума · $(date +%d.%m.%Y)" --body-file summary.md --label qa --label qa-summary
          fi
