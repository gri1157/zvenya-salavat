name: Журнал прогнозов

# Без ИИ: раз в день записывает вероятность победы по модели приложения на ближайший матч
# (пока не наступил день матча), а после матча вносит итог. Файл: .github/data/forecast-log.json
on:
  schedule:
    - cron: '50 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: forecast, cancel-in-progress: false }

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Браузер
        run: npm init -y >/dev/null && npm install playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Прогноз
        run: |
          out=$(node .github/qa/forecast.js index.html .github/data/forecast-log.json)
          echo "$out"
          case "$out" in "без изменений"*) echo "SKIP=1" >> "$GITHUB_ENV";; esac
      - name: Автопроверка
        if: env.SKIP != '1'
        run: node .github/qa/check.js index.html
      - name: Сохранить в main
        if: env.SKIP != '1'
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add index.html .github/data/forecast-log.json
          git commit -m "Журнал прогнозов на $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
