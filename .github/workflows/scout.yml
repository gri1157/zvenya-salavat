name: Разведчик источников

# Без ИИ и без записи: только читает открытые сайты и печатает в журнал, что удалось достать.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/data/scout.py index.html
      - name: Таблица КХЛ
        run: python3 .github/data/update_table.py index.html --write
      - name: Сохранить в ветку, если не main
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add index.html
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "Таблица КХЛ по Sports.ru на $(date -u +%F)"
          git push origin HEAD:${{ github.ref_name }}
